name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # ---------------------------------------------------------------- backend
      - name: backend - install
        working-directory: backend
        run: npm install

      - name: backend - typecheck
        working-directory: backend
        run: npm run typecheck

      - name: backend - checar secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_APP_URL: ${{ secrets.DATABASE_APP_URL }}
        run: |
          fail=0
          if [ -z "$DATABASE_URL" ]; then echo "::error::secret DATABASE_URL vazio"; fail=1
          else echo "DATABASE_URL: ${#DATABASE_URL} chars, prefixo ${DATABASE_URL%%:*}"; fi
          if [ -z "$DATABASE_APP_URL" ]; then echo "::error::secret DATABASE_APP_URL vazio"; fail=1
          else echo "DATABASE_APP_URL: ${#DATABASE_APP_URL} chars, prefixo ${DATABASE_APP_URL%%:*}"; fi
          exit $fail

      - name: backend - migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run migrate up

      - name: backend - suíte de isolamento
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_APP_URL: ${{ secrets.DATABASE_APP_URL }}
        run: npm run test:isolation

      # --------------------------------------------------------------- frontend
      - name: frontend - install
        working-directory: frontend
        run: npm install

      - name: frontend - typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: frontend - build
        working-directory: frontend
        run: npm run build
